[llm]
provider_type = "openai-compatible"
provider_name = "cerebras-glm"
model = "zai-glm-4.7"
api_key_env = "CEREBRAS2_API_KEY"
base_url = "https://api.cerebras.ai/v1"
max_tokens = 1000000
request_timeout_secs = 300
network_retries = 3
retry_delay = 10

[generation]
language = "rust"
parallel_extraction = true
max_retries = 3
enable_test = true
enable_review = true
test_mode = "thorough"
security_threshold = 85

custom_instructions = """
Primary types are at the crate root: `use llmposter::{ServerBuilder, Fixture, Provider, ToolCall, FailureConfig}`.
Submodule paths like `llmposter::fixture::FailureConfig` also work but prefer crate-root imports.
The server binds to port 0 (OS-assigned) — use `server.url()` to get the base URL.
Code examples use `#[tokio::main]` with `async fn main()`.
The builder method is `.build().await` — there is NO `.run()` method. Never use `.run()`.
`with_bearer_token(token)` implicitly enables auth checking — no separate `.with_auth(true)` needed.
Bearer auth examples MUST show both paths: a 401 rejection without a token AND a 200 success with the correct Bearer token.
`expires_after_uses()` does not exist yet — do NOT reference it anywhere.
Only import types that are actually used in code examples — no unused imports.
"""

[generation.container]
install_source = "registry"
timeout = 120

[generation.review_llm]
provider_type = "openai-compatible"
provider_name = "cerebras-glm-review"
model = "zai-glm-4.7"
api_key_env = "CEREBRAS2_API_KEY"
base_url = "https://api.cerebras.ai/v1"
max_tokens = 1000000
request_timeout_secs = 300
network_retries = 3
retry_delay = 10
