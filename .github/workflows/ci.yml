name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: no job gets write access unless it
# explicitly opts in via its own `permissions:` block. Matches the
# v0.4.6 audit guidance to make supply-chain blast radius explicit.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  commit-lint:
    name: commit lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Validate PR commits
        shell: bash
        run: |
          MERGE_BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          ERRORS=0
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'

          while IFS= read -r sha; do
            MSG=$(git log --format='%s' -n1 "$sha")
            if ! [[ "$MSG" =~ $PATTERN ]]; then
              echo "::error::Bad commit message: $MSG"
              echo "  Expected: <type>[(scope)][!]: <description>"
              echo "  Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(git rev-list --no-merges "$MERGE_BASE"..HEAD)

          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "::error::$ERRORS commit(s) do not follow conventional commit format"
            echo "See: https://www.conventionalcommits.org/"
            exit 1
          fi
          echo "All commits follow conventional commit format"

  fmt:
    name: cargo fmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ci-${{ runner.os }}
          cache-all-crates: true
      # Run clippy across the feature matrix so `templating`,
      # `jsonpath`, and the no-default-features build all get lint
      # coverage. `--all-features` and `--no-default-features` each
      # instantiate `#[cfg(...)]` code that the default build would
      # compile away silently.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo clippy --no-default-features --all-targets -- -D warnings

  test-cov:
    name: test-cov
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ci-${{ runner.os }}
          cache-all-crates: true
      - uses: taiki-e/install-action@4dae67b63dd39a3df04ccb3b591180bf9b26ddce # cargo-llvm-cov
      - name: Run tests with coverage
        run: |
          # Run with the `ui` feature enabled so the /ui auth-gating
          # tests execute on every PR, but exclude ui.rs (the debug UI
          # view layer — an opt-in tool, untested like main.rs) from
          # the report. Core mock server code is held to 98%.
          cargo llvm-cov --all-targets --features oauth,watch,jsonpath,templating,ui,record --no-report
          cargo llvm-cov report --ignore-filename-regex 'main\.rs|ui\.rs' --fail-under-lines 98
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          slug: SkillDoAI/llmposter
          files: lcov.info
          fail_ci_if_error: false

  test-windows:
    name: test (windows)
    needs: changes
    # Windows has been stable since v0.4.2; run on main pushes only
    # to keep PR feedback loops fast. Regressions caught before release.
    if: needs.changes.outputs.rust == 'true' && github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ci-${{ runner.os }}
          cache-all-crates: true
      - run: cargo test --all-targets --all-features

  sdk-roundtrip:
    name: sdk round-trip (${{ matrix.sdk }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sdk: [openai, anthropic, gemini]
        include:
          - sdk: openai
            package: "openai==1.*"
          - sdk: anthropic
            package: "anthropic==0.*"
          - sdk: gemini
            package: "google-genai>=1,<2"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ci-${{ runner.os }}
          cache-all-crates: true
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
      - name: Build llmposter
        run: cargo build
      - name: Start llmposter
        run: |
          ./target/debug/llmposter --fixtures tests/fixtures/sdk-roundtrip.yaml --port 19871 &
          echo $! > "${{ runner.temp }}/llmposter.pid"
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:19871/code/200 > /dev/null && break
            sleep 0.25
          done
          curl -sf http://127.0.0.1:19871/code/200 > /dev/null || { echo "llmposter did not start in time"; exit 1; }
      - name: Run SDK tests
        run: uv run --with '${{ matrix.package }}' python3 tests/fixtures/sdk-roundtrip-${{ matrix.sdk }}.py
      - name: Stop llmposter
        if: always()
        run: kill $(cat "${{ runner.temp }}/llmposter.pid") 2>/dev/null || true

  audit:
    name: security audit
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@a2f722730299dbf738978a9c45022481de28e928 # cargo-audit
      - run: cargo audit
