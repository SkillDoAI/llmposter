name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      sdk_fixtures: ${{ steps.filter.outputs.sdk_fixtures }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            sdk_fixtures:
              - 'tests/fixtures/sdk-roundtrip*.py'
              - 'tests/fixtures/sdk-roundtrip.yaml'

  commit-lint:
    name: commit lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Validate PR commits
        shell: bash
        run: |
          MERGE_BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          ERRORS=0
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'

          while IFS= read -r sha; do
            MSG=$(git log --format='%s' -n1 "$sha")
            if ! [[ "$MSG" =~ $PATTERN ]]; then
              echo "::error::Bad commit message: $MSG"
              echo "  Expected: <type>[(scope)][!]: <description>"
              echo "  Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(git rev-list --no-merges "$MERGE_BASE"..HEAD)

          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "::error::$ERRORS commit(s) do not follow conventional commit format"
            echo "See: https://www.conventionalcommits.org/"
            exit 1
          fi
          echo "All commits follow conventional commit format"

  fmt:
    name: cargo fmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ci-${{ runner.os }}
          cache-all-crates: true
      - run: cargo clippy --all-targets -- -D warnings

  test-cov:
    name: test-cov
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ci-${{ runner.os }}
          cache-all-crates: true
      - uses: taiki-e/install-action@4dae67b63dd39a3df04ccb3b591180bf9b26ddce # cargo-llvm-cov
      - name: Run tests with coverage
        run: |
          cargo llvm-cov --all-targets --all-features --no-report
          cargo llvm-cov report --ignore-filename-regex 'main\.rs' --fail-under-lines 98
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6
        with:
          slug: SkillDoAI/llmposter
          files: lcov.info
          fail_ci_if_error: false

  sdk-roundtrip:
    name: sdk round-trip (${{ matrix.sdk }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.sdk_fixtures == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sdk: [openai, anthropic, gemini]
        include:
          - sdk: openai
            package: "openai==1.*"
          - sdk: anthropic
            package: "anthropic==0.*"
          - sdk: gemini
            package: "google-genai"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ci-${{ runner.os }}
          cache-all-crates: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Build llmposter
        run: cargo build
      - name: Start llmposter
        run: |
          ./target/debug/llmposter --fixtures tests/fixtures/sdk-roundtrip.yaml --port 19871 &
          echo $! > /tmp/llmposter.pid
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:19871/code/200 > /dev/null && break
            sleep 0.25
          done
      - name: Run SDK tests
        run: uv run --with '${{ matrix.package }}' python3 tests/fixtures/sdk-roundtrip-${{ matrix.sdk }}.py
      - name: Stop llmposter
        if: always()
        run: kill $(cat /tmp/llmposter.pid) 2>/dev/null || true

  audit:
    name: security audit
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
      - uses: taiki-e/install-action@a2f722730299dbf738978a9c45022481de28e928 # cargo-audit
      - run: cargo audit
