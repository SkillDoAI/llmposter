name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-gate:
    name: Validate release preconditions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Extract version from tag
        id: tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION (from tag $TAG_NAME)"

      - name: Verify Cargo.toml version matches tag
        env:
          EXPECTED: ${{ steps.tag.outputs.version }}
        run: |
          # cargo metadata is robust against workspace layouts where the
          # package version comes from `version.workspace = true` instead of
          # a bare `version = "..."` line in the package table.
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 --manifest-path Cargo.toml | jq -r '.packages[0].version')
          if [ -z "$CARGO_VERSION" ] || [ "$CARGO_VERSION" = "null" ]; then
            echo "::error file=Cargo.toml::Could not extract version from Cargo.toml via cargo metadata."
            exit 1
          fi
          if [ "$CARGO_VERSION" != "$EXPECTED" ]; then
            echo "::error file=Cargo.toml::Cargo.toml version ($CARGO_VERSION) does not match release tag ($EXPECTED). Bump Cargo.toml before tagging."
            exit 1
          fi
          echo "OK: Cargo.toml version $CARGO_VERSION matches tag"

      - name: Verify CHANGELOG.md has a dated section for this version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # Escape regex metacharacters in VERSION (dots, etc.) before
          # interpolating into extended-regex below. The fixed-string grep on
          # SECTION_LINE already binds us to literal "[X.Y.Z]" content, but
          # being explicit keeps the pattern correct if either step changes.
          VERSION_ESC="${VERSION//./\\.}"
          # Locate the section header line for this version, if any.
          SECTION_LINE=$(grep -F "## [${VERSION}]" CHANGELOG.md | head -1 || true)
          if [ -z "$SECTION_LINE" ]; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md is missing a section for version ${VERSION}. Expected a header line starting with '## [${VERSION}] - YYYY-MM-DD'."
            exit 1
          fi
          # Reject TBD / Unreleased / any non-dated header — the crates.io
          # tarball freezes this file, so anything but a real date ships as a
          # permanent mistake on the published crate.
          if echo "$SECTION_LINE" | grep -qiE '(TBD|Unreleased)'; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md section for ${VERSION} still says TBD/Unreleased: '$SECTION_LINE'. Stamp the actual release date before tagging."
            exit 1
          fi
          if ! echo "$SECTION_LINE" | grep -qE '\['"${VERSION_ESC}"'\] - [0-9]{4}-[0-9]{2}-[0-9]{2}'; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md section for ${VERSION} does not have a YYYY-MM-DD date: '$SECTION_LINE'."
            exit 1
          fi
          echo "OK: CHANGELOG.md has a dated section for ${VERSION}"
          echo "    $SECTION_LINE"

  build:
    name: Build ${{ matrix.target }}
    needs: release-gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: linux-amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            archive: linux-arm64
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: darwin-arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --all-features --target ${{ matrix.target }}

      - name: Package
        env:
          TAG_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          cd "target/${TARGET}/release"
          tar czf "../../../llmposter-${TAG_NAME}-${ARCHIVE}.tar.gz" llmposter
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: llmposter-${{ matrix.archive }}
          path: llmposter-${{ github.ref_name }}-${{ matrix.archive }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum llmposter-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/llmposter-*.tar.gz
            artifacts/SHA256SUMS

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Publish
        run: |
          cargo publish --locked --dry-run
          cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate formula
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          SHA_LINUX_AMD64=$(sha256sum artifacts/llmposter-${TAG_NAME}-linux-amd64.tar.gz | cut -d' ' -f1)
          SHA_LINUX_ARM64=$(sha256sum artifacts/llmposter-${TAG_NAME}-linux-arm64.tar.gz | cut -d' ' -f1)
          SHA_MACOS_ARM64=$(sha256sum artifacts/llmposter-${TAG_NAME}-darwin-arm64.tar.gz | cut -d' ' -f1)

          URL_BASE="https://github.com/SkillDoAI/llmposter/releases/download/${TAG_NAME}"
          cat > llmposter.rb <<FORMULA
          class Llmposter < Formula
            desc "Mock LLM API server — fixture-driven, deterministic responses for testing"
            homepage "https://github.com/SkillDoAI/llmposter"
            version "${VERSION}"
            license "AGPL-3.0-or-later"

            on_macos do
              on_arm do
                url "${URL_BASE}/llmposter-${TAG_NAME}-darwin-arm64.tar.gz"
                sha256 "${SHA_MACOS_ARM64}"
              end
            end

            on_linux do
              on_intel do
                url "${URL_BASE}/llmposter-${TAG_NAME}-linux-amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
              on_arm do
                url "${URL_BASE}/llmposter-${TAG_NAME}-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
            end

            def install
              bin.install "llmposter"
            end

            test do
              assert_match "llmposter", shell_output("\#{bin}/llmposter --help")
            end
          end
          FORMULA
          cat llmposter.rb

      - name: Push to homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.SKILLDO_RELEASE }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git clone "https://github.com/SkillDoAI/homebrew-tap.git" tap
          git -C tap remote set-url origin "https://x-access-token:${TAP_TOKEN}@github.com/SkillDoAI/homebrew-tap.git"
          mkdir -p tap/Formula
          cp llmposter.rb tap/Formula/llmposter.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/llmposter.rb
          if git diff --cached --quiet; then
            echo "No changes to formula, skipping commit"
          else
            git commit -m "Update llmposter to ${TAG_NAME}"
            git push
          fi
