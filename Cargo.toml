[package]
name = "llmposter"
version = "0.1.0"
edition = "2021"
description = "Mock LLM API server — fixture-driven, deterministic responses for testing"
license = "AGPL-3.0"

[[bin]]
name = "llmposter"
path = "src/main.rs"

[lib]
name = "llmposter"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-test = "0.4"
