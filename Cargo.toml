[package]
name = "llmposter"
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
description = "Mock LLM API server — fixture-driven, deterministic responses for testing"
license = "AGPL-3.0-or-later"
repository = "https://github.com/SkillDoAI/llmposter"
homepage = "https://github.com/SkillDoAI/llmposter"
readme = "README.md"
keywords = ["mock", "llm", "testing", "openai", "anthropic"]
categories = ["development-tools::testing", "web-programming::http-server"]
exclude = [
    ".github/",
    ".gitignore",
    ".pre-commit-config.yaml",
    "dev/",
    "docs/superpowers/",
    ".SKILL.md.*",
    "SKILL.md",
    "GEMINI.md",
    "AUDIT-PROMPT*.md",
    "RESUME-ME.sh",
    "about.toml",
    "skilldo.toml",
    "cliff.toml",
    "codecov.yml",
    "tarpaulin-report.json",
    "build_rs_cov.profraw",
]

[features]
default = ["oauth"]
oauth = ["dep:oauth-mock", "dep:reqwest"]

[[bin]]
name = "llmposter"
path = "src/main.rs"

[lib]
name = "llmposter"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
oauth-mock = { version = "0.4", optional = true }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "form"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "stream"] }
oauth-mock = "0.4"
tokio-test = "0.4"
