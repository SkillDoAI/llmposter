[package]
name = "llmposter"
version = "0.4.4"
edition = "2021"
rust-version = "1.89"
description = "Drop-in mock server for OpenAI, Anthropic & Gemini APIs — library or standalone CLI. SSE streaming, tool calling, OAuth2, failure injection, streaming chaos, stateful scenarios, request capture, hot-reload, response templating. Test LLM apps without burning tokens."
license = "AGPL-3.0-or-later"
repository = "https://github.com/SkillDoAI/llmposter"
homepage = "https://skilldoai.com"
readme = "README.md"
keywords = ["llm", "mock", "openai", "anthropic", "gemini"]
categories = ["development-tools::testing", "web-programming::http-server"]
exclude = [
    ".github/",
    ".gitignore",
    ".pre-commit-config.yaml",
    "dev/",
    "docs/superpowers/",
    ".SKILL.md.*",
    "GEMINI.md",
    "AUDIT-PROMPT*.md",
    "RESUME-ME.sh",
    "about.toml",
    "skilldo.toml",
    "cliff.toml",
    "codecov.yml",
    "tarpaulin-report.json",
    "build_rs_cov.profraw",
]

[features]
default = ["oauth", "watch"]
oauth = ["dep:oauth-mock", "dep:reqwest"]
watch = ["dep:notify-debouncer-mini"]
templating = ["dep:minijinja"]

[[bin]]
name = "llmposter"
path = "src/main.rs"

[lib]
name = "llmposter"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
minijinja = { version = "2", optional = true, default-features = false, features = ["builtins", "serde"] }
notify-debouncer-mini = { version = "0.6", optional = true, default-features = false }
oauth-mock = { version = "0.4", optional = true }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "form"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

[package.metadata.binstall]
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-linux-amd64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-linux-arm64.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-darwin-arm64.tar.gz"

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "stream"] }
oauth-mock = "0.4"
tokio-test = "0.4"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
